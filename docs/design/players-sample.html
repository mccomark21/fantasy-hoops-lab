<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players · sample · Fantasy Hoops Lab</title>
<script>try { const t = localStorage.getItem("lab-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: Archivo; font-style: normal; font-weight: 400 900; font-stretch: 62% 125%; font-display: swap;
  src: url(fonts/archivo-latin.woff2) format("woff2");
}
:root {
  --lab-stock: #ffffff; --lab-ink: #14171c; --lab-mute: #5b6270; --lab-rule: #e7e9ee; --lab-blue: #1d4f91; --lab-blue-deep: #163f75; --lab-on-blue: #ffffff; --lab-red: #c8102e; --lab-on-red: #ffffff; --lab-green: #17743a; --mark: #1d4f91; --zebra: #eff3f8; --qcol: #e0e8f4; --qcol-z: #dae3f1; --vrule: #d2d9e4; --lamp-off: #6f7889; --lab-scrim: rgb(8 16 32 / .5); color-scheme: light;
  --lab-face: Archivo, "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lab-stock: #0e1a2e; --lab-ink: #eef2f8; --lab-mute: #a7b2c4; --lab-rule: #23334d; --lab-blue: #16305a; --lab-blue-deep: #1f3f73; --lab-on-blue: #ffffff; --lab-red: #ff7d8d; --lab-on-red: #0e1a2e; --lab-green: #6fd08c; --mark: #8fb3ff; --zebra: #142540; --qcol: #1c3254; --qcol-z: #223a60; --vrule: #2e4264; --lamp-off: #7d8eab; --lab-scrim: rgb(8 16 32 / .5); color-scheme: dark; }
}
:root[data-theme="dark"] { --lab-stock: #0e1a2e; --lab-ink: #eef2f8; --lab-mute: #a7b2c4; --lab-rule: #23334d; --lab-blue: #16305a; --lab-blue-deep: #1f3f73; --lab-on-blue: #ffffff; --lab-red: #ff7d8d; --lab-on-red: #0e1a2e; --lab-green: #6fd08c; --mark: #8fb3ff; --zebra: #142540; --qcol: #1c3254; --qcol-z: #223a60; --vrule: #2e4264; --lamp-off: #7d8eab; --lab-scrim: rgb(8 16 32 / .5); color-scheme: dark; }
::selection { background: var(--lab-blue); color: var(--lab-on-blue); }
</style>
<style>
/* Card Back: the site menu. A royal-blue side panel on a desktop, a top bar with a drawer on a phone. */
:root { --lab-menu-w: 216px; --z-menu: 30; --z-scrim: 20; --z-bar: 10; }
body.lab { margin: 0; background: var(--lab-stock); color: var(--lab-ink); }
body.lab-locked { overflow: hidden; }
.lab-menu {
  position: fixed; inset: 0 auto 0 0; width: var(--lab-menu-w); z-index: var(--z-menu);
  display: flex; flex-direction: column; background: var(--lab-blue); color: var(--lab-on-blue);
  font: 600 14px/1.3 var(--lab-face); padding: 22px 0 18px; overflow-y: auto;
}
.lab-site {
  display: block; color: inherit; text-decoration: none; padding: 0 20px 16px; margin: 0 0 10px;
  font-weight: 900; font-stretch: 68%; text-transform: uppercase; font-size: 24px; line-height: .95;
  border-bottom: 3px solid var(--lab-on-blue);
}
.lab-site small { display: block; margin-top: 7px; font-size: 12px; font-weight: 600; font-stretch: 100%;
  text-transform: none; line-height: 1.2; }
.lab-menu ul { list-style: none; margin: 0; padding: 0; }
.lab-menu li a {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 20px;
  color: inherit; text-decoration: none; font-size: 15px;
}
.lab-menu li a::before { content: ""; width: 9px; height: 9px; flex: none; }
.lab-menu li a:hover { background: var(--lab-blue-deep); }
.lab-menu li a[aria-current] { background: var(--lab-stock); color: var(--lab-ink); font-weight: 800; }
.lab-menu li a[aria-current]::before { background: var(--lab-red); }
.lab-menu a:focus-visible, .lab-open:focus-visible { outline: 2px solid var(--lab-on-blue); outline-offset: -4px; }
.lab-menu li a[aria-current]:focus-visible { outline-color: var(--lab-ink); }
.lab-bar, .lab-close { display: none; }
.lab-main { display: block; margin-left: var(--lab-menu-w); min-width: 0; }
@media (max-width: 899px) {
  .lab-bar {
    position: sticky; top: 0; z-index: var(--z-bar); display: flex; align-items: center;
    justify-content: space-between; min-height: 48px;
    padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    background: var(--lab-blue); color: var(--lab-on-blue); font: 900 18px/1 var(--lab-face);
  }
  .lab-name { color: inherit; text-decoration: none; font-stretch: 68%; text-transform: uppercase; font-size: 20px; }
  .lab-name:focus-visible { outline: 2px solid var(--lab-on-blue); outline-offset: 2px; }
  .lab-open {
    min-height: 40px; padding: 0 14px; border: 2px solid var(--lab-on-blue); border-radius: 0; background: transparent;
    color: inherit; font: 800 14px/1 var(--lab-face); text-transform: uppercase; cursor: pointer;
  }
  .lab-menu { transform: translateX(-100%); visibility: hidden;
    transition: transform .28s cubic-bezier(.16, 1, .3, 1), visibility 0s .28s; }
  .lab-menu.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.16, 1, .3, 1); }
  .lab-main { margin-left: 0; }
  .lab-close {
    display: block; align-self: flex-end; margin: -10px 12px 10px 0; min-height: 40px; padding: 0 14px;
    border: 2px solid var(--lab-on-blue); background: transparent; color: var(--lab-on-blue);
    font: 800 14px/1 var(--lab-face); text-transform: uppercase; cursor: pointer;
  }
  .lab-close:focus-visible { outline: 2px solid var(--lab-on-blue); outline-offset: 2px; }
  .lab-scrim { position: fixed; inset: 0; z-index: var(--z-scrim); background: var(--lab-scrim); }
}
.lab-scrim[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .lab-menu, .lab-menu.open { transition: none; } }
.lab-theme { margin: auto 0 0; padding: 16px 20px 0; font-size: 12px; font-weight: 600; }
.lab-theme > span { display: block; margin-bottom: 6px; }
.lab-seg { display: flex; border: 2px solid var(--lab-on-blue); }
.lab-seg button {
  flex: 1; min-height: 36px; padding: 0 4px; border: 0; background: transparent; color: var(--lab-on-blue);
  font: 700 13px/1 var(--lab-face); cursor: pointer;
}
.lab-seg button + button { border-left: 2px solid var(--lab-on-blue); }
.lab-seg button:hover { background: var(--lab-blue-deep); }
.lab-seg button[aria-pressed="true"] { background: var(--lab-stock); color: var(--lab-ink); font-weight: 900; }
.lab-seg button:focus-visible { outline: 2px solid var(--lab-on-blue); outline-offset: 2px; position: relative;
  z-index: 1; }
</style>
<style>
/* The shared tables (issue 143): the look of the Roster table, for each table with the class lab-t. Below 900px,
   the phone row of the Roster (.m-p) gets the same band, rank and name. The head and row rules use :where(), so that
   a class rule of a page wins over them. */
table.lab-t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
:where(.lab-t) thead th, :where(.lab-t) thead td { font-size: 11px; font-weight: 800; color: var(--mark); text-align: right;
  padding: 0 6px 6px; vertical-align: bottom; border-bottom: 2px solid var(--mark); }
:where(.lab-t) thead .l { text-align: left; }
:where(.lab-t) tbody td, :where(.lab-t) tbody th { height: 46px; border-bottom: 1px solid var(--lab-rule); padding: 0 6px;
  text-align: right; vertical-align: middle; font-weight: 400; }
:where(.lab-t) tbody tr:nth-child(even) > * { background: var(--zebra); }
.lab-t .s1 { border-left: 1px solid var(--vrule); }
.lab-t td.band { padding: 0; text-align: center; background: var(--team) !important; color: var(--team-ink);
  font-weight: 900; font-stretch: 70%; font-size: 19px; border-bottom: 1px solid var(--lab-stock); }
.lab-t td.rk { color: var(--lab-red); font-weight: 900; font-stretch: 75%; font-size: 21px; padding-right: 8px; }
.lab-t th.pl { text-align: left; padding: 3px 6px 3px 10px; line-height: 1; }
.lab-t .pl b { font-weight: 900; font-stretch: 66%; font-size: 20px; text-transform: uppercase; line-height: 1; }
.lab-t .pl small { display: block; font-size: 12px; line-height: 1.2; color: var(--lab-mute); margin-top: 2px; }
.lab-t td.n { font-size: 14px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .lab-t td.band, :root:not([data-theme="light"]) .m-p .band {
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lab-ink) 22%, transparent); }
}
:root[data-theme="dark"] .lab-t td.band, :root[data-theme="dark"] .m-p .band {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lab-ink) 22%, transparent); }
/* Phone: the sizes of the phone row of the Roster. */
@media (max-width: 899px) {
  :where(.lab-t) tbody td, :where(.lab-t) tbody th { height: 52px; }
  .lab-t td.band { font-size: 17px; }
  .lab-t td.rk { font-size: 19px; }
  .lab-t .pl b { font-size: 18px; }
  .m-p .band { background: var(--team); color: var(--team-ink); font-weight: 900; font-stretch: 70%; font-size: 17px; }
  .m-p .rk { color: var(--lab-red); font-weight: 900; font-stretch: 75%; font-size: 19px; }
  .m-p .nm b { font-weight: 900; font-stretch: 66%; font-size: 18px; text-transform: uppercase; }
}
</style>
<style>
body { margin: 0; background: var(--lab-stock); color: var(--lab-ink); font-family: var(--lab-face); font-size: 13px; line-height: 1.35; }
.pp { padding: 14px 24px 16px; max-width: 1240px; box-sizing: border-box; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
a { color: var(--mark); }
svg text, table { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--lab-ink); outline-offset: 2px; }

/* top line: sample note, picker, info */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--lab-mute); margin-bottom: 8px; }
.top .note b { color: var(--lab-ink); font-weight: 800; }
.top input { font: inherit; font-size: 12px; padding: 3px 6px; width: 150px; border: 1.5px solid var(--lamp-off); border-radius: 0;
  background: var(--lab-stock); color: var(--lab-ink); }
.chip { font: inherit; font-size: 11px; font-weight: 800; padding: 3px 7px; border: 1.5px solid var(--lamp-off); background: var(--lab-stock);
  color: var(--lab-ink); border-radius: 0; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--mark); border-color: var(--mark); color: var(--lab-stock); }
.msg { color: var(--lab-red); font-weight: 800; }
.info { position: relative; margin-left: auto; }
.info summary { list-style: none; cursor: pointer; width: 22px; height: 22px; border: 1.5px solid var(--lab-ink); display: flex;
  align-items: center; justify-content: center; font-weight: 900; font-size: 13px; color: var(--lab-ink); font-style: italic; }
.info summary::-webkit-details-marker { display: none; }
.info[open] summary { background: var(--lab-ink); color: var(--lab-stock); }
.info .pop { position: absolute; right: 0; top: 28px; width: min(560px, 86vw); max-height: 70vh; overflow: auto; z-index: 20;
  background: var(--lab-stock); color: var(--lab-ink); border: 1.5px solid var(--lab-ink); padding: 10px 14px; font-size: 12px; }
.pop h3 { margin: 0 0 4px; font-weight: 900; font-stretch: 75%; font-size: 15px; text-transform: uppercase; }
.pop ul { padding-left: 16px; margin: 4px 0; } .pop li { margin: 4px 0; } .pop code { font-size: 11px; }

/* header row */
.head { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px 16px; padding-bottom: 8px; border-bottom: 3px solid var(--mark); }
.head .band { background: var(--team); color: var(--team-ink); font-weight: 900; font-stretch: 70%; font-size: 19px; width: 54px;
  display: flex; align-items: center; justify-content: center; }
.head h1 { margin: 0; color: var(--mark); font-weight: 900; font-stretch: 66%; font-size: 38px; line-height: .9; text-transform: uppercase; }
.head .sub { font-size: 12px; color: var(--lab-mute); margin-top: 3px; }
.head .sub a { font-weight: 800; }
.kv { display: flex; align-items: flex-end; gap: 0; }
.kv div { padding: 0 12px; border-left: 1px solid var(--lab-rule); }
.kv dt { font-size: 11px; color: var(--lab-mute); }
.kv dd { margin: 0; font-weight: 900; font-stretch: 75%; font-size: 24px; line-height: 1; }
.kv dd small { font-size: 11px; font-weight: 600; font-stretch: 100%; color: var(--lab-mute); margin-left: 3px; }
.sigs { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; margin: 0; padding: 0; list-style: none; max-width: 330px; }
.sigs a { color: var(--lab-ink); text-decoration: none; display: flex; gap: 6px; align-items: baseline; font-size: 12px; }
.sigs a:hover .t { text-decoration: underline; }
.sig-k { flex: none; font-size: 10.5px; font-weight: 800; border: 1.5px solid var(--lab-ink); padding: 0 4px; white-space: nowrap; }
.sig-k.alert { background: var(--lab-red); border-color: var(--lab-red); color: var(--lab-on-red); }
.sigs .none { font-size: 12px; color: var(--lab-mute); } .sigs .none b { color: var(--lab-ink); }

/* quadrants */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; margin-top: 10px; }
.q { min-width: 0; display: flex; flex-direction: column; }
.q h2 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-weight: 900; font-stretch: 75%; font-size: 17px; line-height: 1.1;
  text-transform: uppercase; margin: 0; padding-bottom: 3px; border-bottom: 2px solid var(--mark); scroll-margin-top: 60px; }
.q h2 .lab { font-size: 12px; font-weight: 700; font-stretch: 100%; text-transform: none; color: var(--lab-mute); }
.q h2 .lab b { color: var(--lab-ink); font-weight: 800; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11px; color: var(--lab-mute); margin: 4px 0 0; align-items: center; }
.legend svg { vertical-align: middle; margin-right: 3px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.state { font-size: 11px; color: var(--lab-mute); margin: 2px 0 0; }
.state b { color: var(--lab-ink); font-weight: 800; }
.empty { border: 1.5px dashed var(--lamp-off); color: var(--lab-mute); padding: 18px; text-align: center; }

.g-grid { stroke: var(--lab-rule); stroke-width: 1; }
.g-axis { fill: var(--lab-mute); font-size: 11px; }
.g-axis-b { fill: var(--lab-ink); font-size: 11px; font-weight: 700; }
.g-band { fill: var(--qcol); }
.g-ref { stroke: var(--lab-mute); stroke-width: 1; }
.l-ink { stroke: var(--lab-ink); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.l-off { stroke: var(--lamp-off); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.d-ink { fill: var(--lab-ink); stroke: var(--lab-stock); stroke-width: 2; }
.d-ring { fill: var(--lab-stock); stroke: var(--lamp-off); stroke-width: 2.25; }
.d-dud { fill: var(--lab-red); stroke: var(--lab-stock); stroke-width: 1.5; }
.d-spike { fill: var(--mark); stroke: var(--lab-stock); stroke-width: 1.5; }
.gap-l { stroke: var(--lamp-off); stroke-width: 1.5; }
.bar-now { fill: var(--lab-ink); }
.bar-proj { fill: none; stroke: var(--lamp-off); stroke-width: 1.5; }
.exit { fill: none; stroke: var(--lab-red); stroke-width: 2; }
.exit-t { fill: var(--lab-red); font-size: 11px; font-weight: 800; }
.hit { fill: transparent; }
.hit:hover, .hit:focus { fill: color-mix(in srgb, var(--mark) 8%, transparent); }
.tip { position: absolute; pointer-events: none; background: var(--lab-stock); color: var(--lab-ink); border: 1.5px solid var(--lab-ink);
  padding: 5px 7px; font-size: 12px; line-height: 1.35; white-space: nowrap; z-index: 5; font-variant-numeric: tabular-nums; }
.tip b { font-weight: 800; }

/* comps: the Roster-look table, tightened */
table.sim { table-layout: fixed; margin-top: 4px; }
table.sim col.c-band { width: 40px; } table.sim col.c-v { width: 54px; } table.sim col.c-d { width: 92px; }
.lab-t.sim tbody td, .lab-t.sim tbody th { height: 44px; }
.lab-t.sim .pl b { font-size: 17px; }
.lab-t.sim .pl small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab-t.sim td.band { font-size: 15px; }
.lab-t.sim td.n b { font-weight: 800; }


/* Before / After toggle */
.look { display: inline-flex; margin-right: 6px; }
.look .chip + .chip { border-left: 0; }
/* After look: no legends (direct labels), muted support marks, one hero mark */
.v-after .q .legend { display: none; }
.v-after .q h2 { border-bottom-width: 1px; }
.a-axis { fill: var(--lab-mute); font-size: 10.5px; }
.a-label { fill: var(--lab-ink); font-size: 11px; font-weight: 700; }
.a-band { fill: var(--zebra); }
.a-ref { stroke: var(--lab-rule); stroke-width: 1; }
.a-second { stroke: var(--lamp-off); stroke-width: 1.25; fill: none; stroke-linejoin: round; opacity: .8; }
.a-dot { fill: var(--lamp-off); opacity: .75; }
.a-dud { fill: var(--lab-red); }
.a-spike { fill: var(--lab-ink); }
.a-hero { stroke: var(--mark); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.a-hero-dot { fill: var(--mark); stroke: var(--lab-stock); stroke-width: 2; }
.a-track { stroke: var(--lab-rule); stroke-width: 1; }
.a-conn { stroke: var(--lamp-off); stroke-width: 1.25; opacity: .7; }
.a-proj { fill: var(--lab-stock); stroke: var(--lamp-off); stroke-width: 1.25; }
.a-now { fill: var(--mark); stroke: var(--lab-stock); stroke-width: 2; }


/* Shared tooltip card (After + tooltips) */
.tt { position: fixed; z-index: 50; pointer-events: none; min-width: 168px; max-width: 260px; box-sizing: border-box;
  background: var(--lab-stock); color: var(--lab-ink); border: 1px solid var(--lamp-off); border-radius: 3px;
  padding: 7px 10px 8px; font-size: 12px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.tt-ctx { color: var(--lab-mute); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt-key { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 1px; }
.tt-num { font-size: 20px; font-weight: 800; font-stretch: 85%; line-height: 1.1; }
.tt-lab { color: var(--lab-mute); font-size: 11px; }
.tt-rows { display: grid; grid-template-columns: auto auto; gap: 1px 14px; margin: 4px 0 0; padding-top: 4px; border-top: 1px solid var(--lab-rule); }
.tt-rows dt { color: var(--lab-mute); white-space: nowrap; }
.tt-rows dd { margin: 0; text-align: right; white-space: nowrap; }
.a-cross { stroke: var(--lamp-off); stroke-width: 1; }
.v-after .hit:focus-visible { outline: none; stroke: var(--lamp-off); stroke-width: 1; }
tr.tt-row { cursor: default; }
tr.tt-row:hover > *, tr.tt-row:focus > * { background: var(--qcol) !important; }
tr.tt-row:hover td.band, tr.tt-row:focus td.band { background: var(--team) !important; }
tr.tt-row:focus { outline: 2px solid var(--lab-ink); outline-offset: -2px; }
@media (prefers-reduced-motion: no-preference) { .tt { transition: none; } }

@media (max-width: 800px) {
  .pp { padding: 12px 14px 32px; }
  .grid { grid-template-columns: 1fr; gap: 12px; }
  .q { border: 1.5px solid var(--lab-rule); padding: 10px 12px; }
  .info { margin-left: 0; }
  .kv div:first-child { padding-left: 0; border-left: 0; }
}
</style>
</head>
<body>
<header class="lab-bar"><a class="lab-name" href="../">Fantasy Hoops Lab</a>
<button class="lab-open" type="button" aria-controls="lab-menu" aria-expanded="false">Menu</button></header>
<nav class="lab-menu" id="lab-menu" aria-label="Site">
<button class="lab-close" type="button">Close</button>
<a class="lab-site" href="../">Fantasy<br>Hoops Lab<small>2026–27 · 14-team league</small></a>
<ul>
<li><a href="../">Home</a></li>
<li><a href="../roster/">Roster</a></li>
<li><a href="../adds/">Adds plan</a></li>
<li><a href="../free-agents/">Free agents</a></li>
<li><a href="../trade/">Trades</a></li>
<li><a href="#" aria-current="page">Players</a></li>
</ul>
<div class="lab-theme" role="group" aria-labelledby="lab-theme-l">
<span id="lab-theme-l">Theme</span>
<div class="lab-seg"><button type="button" data-set="system" aria-pressed="true">Auto</button><button type="button" data-set="light" aria-pressed="false">Light</button><button type="button" data-set="dark" aria-pressed="false">Dark</button></div>
</div>
</nav>
<div class="lab-scrim" hidden></div>
<main class="lab-main">
<div class="pp">
<div class="top" role="search">
  <span class="note"><b>Sample, 2026-10-29.</b> 3 players, real data.</span>
  <span class="look" role="group" aria-label="Chart look"><button type="button" class="chip" data-look="before">Before</button><button type="button" class="chip" data-look="after">After</button><button type="button" class="chip" data-look="tips">After + tooltips</button></span>
  <label for="q" class="vh">Player</label>
  <input id="q" type="search" list="names" autocomplete="off" placeholder="Find a player">

    if (v == null || (v <= tr.hi && v >= tr.lo)) return;
    el("rect", { x: x(i) - 6, y: y(v) - 6, width: 12, height: 12, class: "exit" }, svg);
    el("text", { x: x(i), y: y(v) + (v > tr.hi ? -10 : 20), "text-anchor": "middle", class: "exit-t" }, svg, v > tr.hi ? "▲ out" : "▼ out");
  });
  if (tr.roll[n - 1] != null) el("text", { x: x(n - 1) + 9, y: y(tr.roll[n - 1]) + 4, class: "g-axis-b" }, svg, f1(tr.roll[n - 1]));
  p.games.forEach((g, i) => {
    el("text", { x: x(i), y: H - B + 14, "text-anchor": "middle", class: "g-axis-b" }, svg, g.date);
    el("text", { x: x(i), y: H - B + 27, "text-anchor": "middle", class: "g-axis" }, svg, "v " + g.opp);
  });
  box.appendChild(svg);
  p.games.forEach((g, i) => hover(svg, box, { x: x(i) - step / 2, y: T, width: step, height: H - T - B }, opt.tip(g, i), x(i), y(Math.max(g[key], opt.second ? g[opt.second] : -1e9))));
}

/* Category bars: now (filled) and projection (hollow outline), percentile in the pool. */
function catChart(box, p) {
  if (LOOK !== "before") return catChartAfter(box, p);
  const W = 580, rowH = 38, T = 18, L = 76, R = 112, H = T + rowH * 6 + 4;
  const x = v => L + (W - L - R) * v / 100;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Percentile of each category in the pool: now and projection" });
  [0, 25, 50, 75, 100].forEach(t => { el("line", { x1: x(t), x2: x(t), y1: T - 4, y2: H - 4, class: "g-grid" }, svg); el("text", { x: x(t), y: T - 7, "text-anchor": "middle", class: "g-axis" }, svg, t); });
  el("text", { x: W - R + 24, y: T - 7, class: "g-axis" }, svg, "now · proj /g");
  p.cats.forEach((c, i) => {
    const top = T + rowH * i + 5;
    el("text", { x: 0, y: top + 11, class: "g-axis-b" }, svg, c.cat);
    el("text", { x: 0, y: top + 24, class: "g-axis" }, svg, `×${c.w.toFixed(2)}`);
    el("rect", { x: x(0), y: top + 1, width: Math.max(1, x(c.season) - x(0)), height: 11, class: "bar-now" }, svg);
    el("rect", { x: x(0) + 0.75, y: top + 15.75, width: Math.max(1, x(c.proj) - x(0) - 1.5), height: 8.5, class: "bar-proj" }, svg);
    el("text", { x: W - R + 24, y: top + 15, class: "g-axis-b" }, svg, f1(c.raw));
    el("text", { x: W - R + 58, y: top + 15, class: "g-axis" }, svg, "· " + f1(c.proj_line));
    const html = `<b>${c.cat}</b> · punt weight ${c.w.toFixed(2)}<br>Now: percentile ${Math.round(c.season)} (shrunk ${f2(c.shrunk)}/g)<br>Projection: percentile ${Math.round(c.proj)} (${f2(c.proj_line)}/g)<br>Season to date ${f2(c.raw)}/g in ${p.n} games, weight ${Math.round(c.nw * 100)}%`;
    hover(svg, box, { x: 0, y: top - 4, width: W, height: rowH }, html, x(Math.max(c.season, c.proj)), top);
  });
  box.appendChild(svg);
}

const kDot = c => `<svg width="11" height="11" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4" class="${c}"/></svg>`;
const kTri = (c, up) => `<svg width="12" height="11" aria-hidden="true"><path d="${up ? "M1,10L11,10L6,1Z" : "M1,1L11,1L6,10Z"}" class="${c}"/></svg>`;
const kLine = c => `<svg width="16" height="10" aria-hidden="true"><line x1="1" x2="15" y1="5" y2="5" class="${c}"/></svg>`;
const kBand = `<svg width="13" height="10" aria-hidden="true"><rect width="13" height="10" class="g-band"/></svg>`;
const kBar = c => `<svg width="16" height="10" aria-hidden="true"><rect x=".75" y="1" width="14.5" height="8" class="${c}"/></svg>`;
function bandState(t) {
  if (t.n < M.band_min) return `<b>Too few games for a range:</b> ${t.n} of ${M.band_min}.`;
  if (t.n < M.flag_min) return `<b>Too few games for a flag:</b> ${t.n} of ${M.flag_min}. Range = mean ± ${f1((t.hi - t.lo) / 2)}, mostly the league prior.`;
  return `Range = mean ± ${f1((t.hi - t.lo) / 2)}, mostly the league prior at ${t.n} games.`;
}

function render(p) {
  const mine = p.owner.endsWith("(you)");
  const tot = p.games.reduce((a, g) => a + g.min, 0), comp = p.games.reduce((a, g) => a + g.comp, 0);
  const close = p.games.filter(g => g.close), other = p.games.filter(g => !g.close);
  const avg = a => a.reduce((s, g) => s + g.min, 0) / a.length;
  const u = p.trend_usg, uLast = u.roll[u.roll.length - 1];
  const usgDelta = uLast != null ? uLast - u.mean : null;
  const usgLab = `USG <b>${Math.round(u.mean)}%</b>` + (usgDelta == null ? " (too few games for a trend)" : ` ${usgDelta >= 0 ? "▲" : "▼"} ${sgn1(usgDelta)} last ${M.window}`);
  const closeLab = close.length ? `Close <b>${close.length} of ${p.n}</b>: ${f1(avg(close))} min${other.length ? ` (${f1(avg(other))} other)` : ""}` : `Close <b>0 of ${p.n}</b>`;
  const hasProj = !!p.cats;

  const top = p.signals.slice(0, 3);
  let sig = top.map(s => `<li><a href="#" data-a="${s.anchor}"><span class="sig-k${s.dir === "down" ? " alert" : ""}">${s.kind} ${s.dir === "up" ? "▲" : "▼"}</span><span class="t">${esc(s.text)}</span></a></li>`).join("");
  if (!top.length) sig = p.n < M.flag_min ? `<li class="none"><b>No signals yet:</b> ${p.n} of ${M.flag_min} games</li>` : `<li class="none"><b>No signals: playing to projection</b></li>`;

  $("#profile").innerHTML = `
<header class="head">
  <div class="band" style="${D.bands[p.team]}">${p.team}</div>
  <div>
    <h1>${esc(p.name)}</h1>
    <div class="sub">${esc(p.pos || "–")} · ${mine ? `<a href="../roster/">${esc(p.owner)}</a>` : esc(p.owner)} · <a href="../roster/">Roster</a></div>
  </div>
  <dl class="kv">
    <div><dt>Val</dt><dd>${sgn(p.season_val)}<small>${hasProj ? `proj ${sgn(p.proj_val)}` : ""}</small></dd></div>
    <div><dt>Games</dt><dd>${p.n}<small>of ${p.team_games} · ${f1(tot / p.n)} min</small></dd></div>
  </dl>
  <ul class="sigs" aria-label="Signals">${sig}</ul>
</header>
<div class="grid">
<section class="q" id="q-role" aria-labelledby="h-role">
  <h2 id="h-role">Role <span class="lab">${usgLab}</span><span class="lab">${closeLab}</span></h2>
  <div class="legend"><span>${kDot("d-ink")}Minutes</span><span>${kLine("l-ink")}${M.window}-game</span><span>${kDot("d-ring")}Competitive: ${Math.round(100 * comp / tot)}%</span><span>${kBand}Range</span></div>
  <div class="chart" id="c-min"></div>
  <p class="state">${bandState(p.trend_min)}</p>
</section>
<section class="q" id="q-cats" aria-labelledby="h-cats">
  <h2 id="h-cats">Categories <span class="lab">percentile of the ${M.pool_n}-player pool</span></h2>
  ${hasProj ? `<div class="legend"><span>${kBar("bar-now")}Now, shrunk toward projection</span><span>${kBar("bar-proj")}Projection</span><span>×weight = punt weight</span></div>
  <div class="chart" id="c-cat"></div>
  <p class="state">${p.n} games: the season line has ${Math.round(p.cats[0].nw * 100)}% of the weight for PTS, ${Math.round(p.cats[5].nw * 100)}% for STL.</p>` : `<div class="empty">No projection: no category ranks.</div>`}
</section>
<section class="q" id="q-value" aria-labelledby="h-value">
  <h2 id="h-value">Value <span class="lab"><b>${p.duds}</b> ${p.duds === 1 ? "dud" : "duds"} · <b>${p.spikes}</b> ${p.spikes === 1 ? "spike" : "spikes"} in ${p.n}</span></h2>
  <div class="legend"><span>${kTri("d-dud", false)}Dud</span><span>${kDot("d-ink")}Normal</span><span>${kTri("d-spike", true)}Spike</span><span>${kLine("l-ink")}${M.window}-game</span><span>${kBand}Range</span></div>
  <div class="chart" id="c-val"></div>
  <p class="state">${bandState(p.trend_val)}${p.n < M.flag_min ? ` One game moves a rate ${Math.round(100 / p.n)} points.` : ""}</p>
</section>
<section class="q" id="q-comps" aria-labelledby="h-comps">
  <h2 id="h-comps">Comps <span class="lab">nearest 5 on the blended line</span></h2>
  ${hasProj ? `<table class="lab-t sim"><colgroup><col class="c-band"><col><col class="c-v"><col class="c-d"></colgroup>
  <thead><tr><th class="l">Team</th><th class="l">Player</th><th>Val</th><th>Biggest diff</th></tr></thead>
  <tbody>${p.similar.map(s => `<tr><td class="band" style="${D.bands[s.team] || ""}">${esc(s.team)}</td><th class="pl" scope="row"><b>${esc(s.name)}</b><small>${esc(s.pos)} · ${esc(s.owner)}</small></th><td class="n"><b>${sgn(s.val)}</b></td><td class="n">${s.diff_cat} ${sgn(s.diff)}</td></tr>`).join("")}</tbody></table>
  <p class="state">Val: blended, per game above replacement (his: ${sgn(p.blend_val)}). Diff: their weighted z minus his.</p>` : `<div class="empty">No projection: no blended line to compare.</div>`}
</section>
</div>`;
  const tipG = g => `<b>${g.date} v ${g.opp}</b>${g.started ? " · start" : ""}${g.close ? " · close game" : ""}<br>`;
  const ctxG = g => `${g.date} vs ${g.opp}` + (g.started ? " · start" : " · bench") + (g.close ? " · close game" : "");
  trendChart($("#c-min"), p, {
    card: (g, i) => ({ ctx: ctxG(g), value: fMin(g.min), label: "minutes",
      rows: [["Competitive", fMin(g.comp)], [`${M.window}-game avg`, p.trend_min.roll[i] == null ? `needs ${M.window} games` : fMin(p.trend_min.roll[i])], ["Usage", g.usg == null ? "–" : `${f1(g.usg)}%`]] }),
    aria: "Total and competitive minutes in each game", key: "min", second: "comp", trend: p.trend_min,
    tip: (g, i) => tipG(g) + `${f1(g.min)} min · competitive ${f1(g.comp)}<br>Usage ${f1(g.usg)}% · ${M.window}-game ${f1(p.trend_min.roll[i])} min`
  });
  if (hasProj) catChart($("#c-cat"), p);
  trendChart($("#c-val"), p, {
    card: (g, i) => ({ ctx: ctxG(g), value: fVal(g.val), label: g.val < 0 ? "value · dud" : g.val >= M.spike_level ? "value · spike" : "value",
      rows: [["PTS · REB · AST", `${g.pts} · ${g.reb} · ${g.ast}`], ["3PM · STL · BLK", `${g.threes} · ${g.stl} · ${g.blk}`], [`${M.window}-game avg`, p.trend_val.roll[i] == null ? `needs ${M.window} games` : fVal(p.trend_val.roll[i])]] }),
    aria: "Per-game value above replacement, dots marked dud, normal or spike", key: "val", trend: p.trend_val,
    refs: [{ y: 0, label: "replacement" }, { y: M.spike_level, label: "top-30 level" }],
    dot: g => g.val < 0 ? "d-dud" : g.val >= M.spike_level ? "d-spike" : "d-ink",
    tip: g => tipG(g) + `Value ${sgn(g.val)}${g.val < 0 ? " · dud" : g.val >= M.spike_level ? " · spike" : ""}<br>${g.pts} PTS ${g.reb} REB ${g.ast} AST ${g.threes} 3PM ${g.stl} STL ${g.blk} BLK`
  });
  if (LOOK === "tips") document.querySelectorAll("table.sim tbody tr").forEach((tr, i) => {
    const s = p.similar[i];
    tr.tabIndex = 0; tr.classList.add("tt-row");
    bindCard(tr, { ctx: `${s.name} · ${s.owner}`, value: fVal(s.val), label: "Val, blended",
      rows: [["Biggest diff", `${s.diff_cat} ${sgn(s.diff)} z`], ["Distance", f2(s.dist)], [`${p.name.split(" ").pop()}'s Val`, fVal(p.blend_val)]] },
      () => tr.getBoundingClientRect());
  });
  const target = { minutes: "q-role", usage: "q-role", cats: "q-cats", value: "q-value", consistency: "q-value" };
  document.querySelectorAll(".sigs a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById(target[a.dataset.a]).scrollIntoView(); }));
}

function methods() {
  const f = M.fit, lead = (s, sg) => Math.round(f.z * sg * Math.sqrt(s));
  $("#methods-body").innerHTML = `<h3>Methods and data</h3><ul>
<li><b>Competitive minutes.</b> A moment is decided when the lead is ${f.z} × σ × √(seconds left) or more, about a 99% win chance for a random-walk margin. <b>σ = ${f.sigma.toFixed(3)} points per √second</b>, fit to the ${f.games} logged games: leads of ${lead(1440, f.sigma)} at the start of the 3rd quarter, ${lead(720, f.sigma)} with 12 minutes left, ${lead(360, f.sigma)} with 6. The anchors of decision 3 fit σ = ${f.sigma_anchor.toFixed(3)} (${lead(1440, f.sigma_anchor)}, ${lead(720, f.sigma_anchor)}, ${lead(360, f.sigma_anchor)}). A moment counts again if the lead falls below the line. ${Math.round(f.decided_share * 100)}% of logged game time was decided.</li>
<li><b>Data.</b> ${M.games_logged} games, ${M.first} to ${M.last}: the rotation log and the ESPN game summaries (box scores). Season to date is ESPN, not Yahoo. Projections: <code>${M.proj_file}</code>. ${esc(M.owner_note)}</li>
<li><b>Val.</b> <code>core/valuation.py</code> and <code>adds/value.py</code>: per game, above the replacement level of the valuation. Dud: under 0. Spike: ${sgn(M.spike_level)} or more (the 30th player by projected value).</li>
<li><b>Range.</b> Season mean ± 2 SD / √${M.window}. The SD mixes his own SD with a league SD worth 4 games (minutes ${f1(M.pooled_sd.minutes)}, value ${f1(M.pooled_sd.val)}). A range needs ${M.band_min} games, a flag ${M.flag_min}.</li>
<li><b>Usage.</b> 100 × (FGA + 0.44 FTA + TOV) × (team min / 5) / (min × (team FGA + 0.44 team FTA + team TOV)). The label: season usage, and the last ${M.window}-game average minus it.</li>
<li><b>Categories.</b> Pool: top ${M.pool_n} by projected value (${M.pool_with_games} have games). Now = (n × season + k × projection) / (n + k), k in games: ${Object.entries(M.shrink_k).map(([c, v]) => `${c} ${v}`).join(", ")} (a first guess).</li>
<li><b>Signals.</b> Range exit of the last ${M.window}-game point, a category ${M.gap_pct}+ percentile points from projection, or duds or spikes in ${Math.round(M.rate_flag * 100)}%+ of games. Each needs ${M.flag_min} games. The header shows 3 at most.</li>
<li><b>Comps.</b> Weighted z-scores of the blended line of <code>adds/blend.py</code>: projection moved toward his ESPN line of the last 14 days (weight games / 14). The adds page blends Yahoo lines, so Val can differ.</li>
<li><b>Name gaps.</b> ${M.unmatched_n} ESPN players have no projection match, for example ${esc(M.unmatched_espn.slice(0, 4).join(", "))}. Rostered with no game yet: ${esc(M.rostered_no_games.join(", "))}.</li>
</ul>`;
}
setupPicker();
methods();
route();
</script>
</body>
</html>
