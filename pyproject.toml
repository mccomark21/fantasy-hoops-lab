[project]
name = "fantasy-hoops-lab"
version = "0.1.0"
description = "Analysis tools for one Yahoo fantasy basketball league"
requires-python = ">=3.11"  # tomllib
dependencies = [
  "numpy>=2.4",
  "pandas>=3.0",
  "beautifulsoup4>=4.12",  # adds/readers.py
  "playwright>=1.63",  # fetch/yahoo.py: also run python -m playwright install chromium. adds/session.py uses Edge.
]

[project.optional-dependencies]
test = ["pytest>=9.0"]
lint = ["ruff==0.17.3"]  # exact version: CI and local runs find the same issues

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fantasyhoops.draft" = ["*.js"]
"fantasyhoops.trade" = ["*.js"]
"fantasyhoops.core" = ["fonts/*.woff2", "fonts/*.txt", "icons/*.svg", "icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"  # requires-python

[tool.ruff.lint]
# E225 is a preview rule in ruff 0.17.3. explicit-preview-rules turns on only the preview rules named here.
preview = true
explicit-preview-rules = true
select = ["E4", "E7", "E9", "F", "E225", "W291", "W292", "W293"]
