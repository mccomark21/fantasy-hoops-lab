name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # requires-python in pyproject.toml
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install Chromium for the Playwright page tests (#140), so that they run and do not skip
        run: python -m playwright install --with-deps chromium
      - name: Run the tests
        run: python -m pytest -q -rs

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # requires-python in pyproject.toml
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the lint dependencies (ruff at the version in pyproject.toml)
        run: python -m pip install -e ".[lint]"
      - name: Check the code with ruff
        run: ruff check src tests --output-format github
      - name: Check the format with ruff
        if: ${{ !cancelled() }}  # run also when the lint step fails, so that the PR shows both results
        run: ruff format --check src tests
