name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # requires-python in pyproject.toml
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run the tests
        run: python -m pytest -q -rs

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # requires-python in pyproject.toml
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the lint dependencies (ruff at the version in pyproject.toml)
        run: python -m pip install -e ".[lint]"
      - name: Check the code with ruff
        run: ruff check src tests --output-format github
