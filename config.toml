# Settings for all tools in src/fantasyhoops/. Change a value, then run the tool again.
# [league] applies to all tools. [adds] is for the adds planner (src/fantasyhoops/adds/).
# The other sections are for the draft tools (src/fantasyhoops/draft/).

[league]
teams = 14
roster_spots = 10          # 6 starters (PG, SG, SF, PF, C, Util) + 4 bench; the player pool is teams x roster_spots
slots = ["PG", "SG", "SF", "PF", "C"]  # starting slots for one position (Util and bench take any player)
adds = 5                   # adds each week
playoff_teams = 8          # teams in the playoff bracket (a power of 2)
projections = "data/Projections_*.csv"   # the script uses the newest file; name each file with its download date
espn_season = 2027         # ESPN uses the year that the season ends

# Auction dollars: the teams buy the top teams x spots players by value. Each bought player gets min_bid.
# The rest of the money (teams x budget) goes to the bought players in proportion to value
# above the first player who is not bought. All other players get $0.
[auction]
budget = 200
min_bid = 1
spots = 10                 # bought roster spots for each team

# League price: Yahoo's order of players, with the prices of this league's past drafts. See draft/market.py.
[market]
drafts = "data/draft_results.csv"

# Auction simulator: python -m fantasyhoops.draft.auction. See the docstring of draft/auction.py.
[simulation]
runs = 2000                # auctions for each keeper (about 5 minutes on 16 CPU cores)
noise = 0.20               # spread of the random noise on each bot bid and on the nomination order (lognormal sigma)
seed = 1                   # the same seed gives the same results
# Your keeper candidates. The simulator runs each one as your keeper and compares the results.
# Keeper cost = keeper_prices, else league_price. "No keeper" = keep no one.
keepers = ["Cooper Flagg"]  # confirmed 2026-10-14
keeper_prices = { "Cooper Flagg" = 61 }  # the real keeper prices that the league gives
# Players that other teams keep. Each goes to a bot team at league_price and takes one of its spots.
# Empty for now: the teams are changing their keepers (2026-10-15).
other_keepers = []
# Your strategy: buy core players, then pay min_bid for each other spot and use those spots for streamers.
core = 7
# Your bid for a core player = dollars x (1 - playoff_weight + playoff_weight x fit). fit = what the player
# adds to your playoff score / what a player with an average playoff schedule adds. See draft/team_score.py.
playoff_weight = 1.0
fit_limits = [0.5, 1.5]    # the lowest and the highest fit

# Injury risk and back-to-back rest. The data is data/projection_risk.csv.
# Rankings and draft board: a player with rests_b2b gets no second nights in the schedule columns and the S flag.
# The board shows inj_risk. Neither changes the value. The settings below are for the auction simulator.
[risk]
file = "data/projection_risk.csv"
# Chance that a player misses a whole playoff week, for each inj_risk tier. The projected games already hold
# the average cost of injuries, so the simulator raises his production on the days that he plays to keep his
# expected production the same. The chance changes the spread only: a high-risk core can lose a whole week.
# First values: the share of the season that each tier misses in the newest projections file (1 - mean games / 82):
# low 78 games, med 72, high 67, extreme 60. There is no better source yet.
missed_week = { low = 0.05, med = 0.12, high = 0.19, extreme = 0.27 }
missing_tier = "med"       # tier for a player who is not in the file (med is the most common tier)
# Chance that a player with rests_b2b sits on the second night of a back-to-back. The page says "some or all",
# so start at 1.0. The simulator does not raise his production for these days: the rest days are a small part
# of the projected games, and a rest on a known date is the risk that this setting shows.
rest_chance = 1.0

# Weekly adds planner: python -m fantasyhoops.adds.plan. See docs/adds/README.md.
# The planner reads the Yahoo pages with the saved sign-in in .auth/yahoo/.
[adds]
league = 22820             # Yahoo league ID
team = 10                  # your team ID in the league
team_name = "TradeMark™"   # the team name at the top of the home page (#120)
core = []                  # names of your core players: the planner never suggests to drop them
stream_spots = 3           # stream spots: the empty spots, then the lowest non-core players up to this number
add_delay_days = 0         # days between an add and the first day that the player can start
# The time that the planner waits on each Yahoo page for the element that its reader needs (#74).
# The planner stops with an error that names the page and the element when the element does not appear.
page_wait = 10             # seconds
# Chance that a player with rests_b2b ([risk] file) sits on the second night of a back-to-back. That game counts
# 1 - rest_chance started games in the plans. No data gives a better value yet. 0 = count each game as 1.
# Separate from [risk] rest_chance, so that the draft tools do not change.
rest_chance = 0.5
# Minutes mark on the page: his mean minutes in his last 5 games minus his mean minutes in the last 14 days.
# A change of this number of minutes or more gets the MIN+ mark. The mark does not change the value.
minutes_rise = 4.0         # minutes
# The part of a game this week that a game next week is worth (#60). The last players in the stream spots can stay
# next week with no add. Injuries and role changes can occur before then. No data gives a better value yet. 0 = off.
next_week_weight = 0.5
# Next-week mark on the page (#76): the first days of next week to check for open slots of your kept roster. The page
# marks each free agent who plays on such a day and fits an open slot, for example "Mon open". 0 = off.
next_week_open_days = 2    # days
# Team plan on the page (#140): an add cell lists its NBA teams. With this number of teams or more, the cell gives the
# count, for example "+Util 8 teams".
team_count_at = 6
# Skip the recent view (last 14 days) of the free-agent lists while its blend weight w is small (#90). Before the read,
# the run gets the largest possible w: the most games of one NBA team from 14 days ago to today / 14.
# While that w is below this value, the run reads no recent page, and the values use the projection only.
# The page and the terminal then say so. 0 = never skip. The owner chose 0.3 on 2026-10-26: skip while no team
# played more than 4 games.
recent_skip_weight = 0.3

# Role up: mark a free agent when a starter on his NBA team at one of his positions is absent. The mark changes no value.
# Absent: the starter missed the last games of his team in the rotation log. See docs/adds/README.md, "Role up".
[adds.role_up]
starter_games = 5          # a starter started more than half of his last starter_games games before the absence
days = 7                   # the first missed game is in the last days days, so the absence is new
games = 3                  # the mark stays for this number of missed games. Then the recent line shows the new role

# Starter flag and closer flag on the page (#75, core/role_flags.py). The flags change no value.
# Starter flag: his last window_games games. Closer flag: the last close_window close games of his NBA team.
# Check order: New (the last new_games or new_closes are all starts or closes, and fewer than half of the earlier
# games in the window are), then Regular (regular_share or more), then Inconsistent (some_share or more).
[adds.flags]
window_games = 10
min_games = 5              # fewer games give no starter flag
new_games = 3
close_window = 8
min_close_games = 4        # fewer close games give no closer flag
new_closes = 2
regular_share = 0.7
some_share = 0.2

# Rotation log: python -m fantasyhoops.fetch.rotation writes data/rotation_log.csv. core/rotation.py reads it.
# A close game: at some moment in the last close_minutes of the fourth quarter or of an overtime period,
# the margin is close_margin points or fewer. A close: the player is on the floor at the end of a close game.
[rotation]
close_margin = 5           # points
close_minutes = 5          # minutes at the end of the fourth quarter and of each overtime period
minute_tolerance = 1.5     # the fetch run prints each player whose stints differ from his box-score minutes by more than this
# Competitive minutes (#184): a game is decided while the lead is the lead needed or more. Lead needed =
# z x decided_sigma x the square root of the seconds left. z comes from decided_win_chance (0.99 gives z = 2.33).
# decided_sigma: the spread of the margin change, in points per square root of a second. A fit to 68 games of
# 2026-10-20 to 2026-10-28 gave 0.313. The leads needed: about 28 at the start of the third quarter,
# 20 with 12:00 left and 14 with 6:00 left. The first estimate was 0.251 (22, 16 and 11). The owner can change it.
decided_sigma = 0.313      # points per square root of a second
decided_win_chance = 0.99  # the chance that the team with the lead wins

# Matchup weights: the weight of a category from your margin in the current matchup (adds/matchup.py, #59).
# A margin of close or less keeps weight 1. A margin of large or more (a lead or a deficit) gets min_weight.
# Between the two, the weight goes down in a straight line. The margins are for a whole week. The planner
# multiplies them by the days of the planning window / the days of the fantasy week.
# First values: close = about what one streamer adds in 3 games, large = 3 x close. There is no better source yet.
[adds.matchup]
close = { pts = 40, reb = 15, ast = 10, threes = 5, blk = 3, stl = 3 }
large = { pts = 120, reb = 45, ast = 30, threes = 15, blk = 9, stl = 9 }
min_weight = 0.5           # the lowest weight. Above 0, so a lost or won category still counts a little

# Weight for each category z-score. See docs/draft/category_weights.md.
# Punted categories (FG%, FT%, TO) are not in this list.
[weights]
pts = 1.00
reb = 1.00
ast = 1.00
threes = 0.70
blk = 0.65
stl = 0.50

# Category balance: the benchmark is the weighted z-score of the strong teams in the simulator.
# See draft/benchmark.py.
[category_balance]
top_teams = 4              # teams averaged for the benchmark
band_pct = 0.05            # the "even" band: this share of the weekly benchmark of each category
games_per_week = 3.5       # games of one player in one week (docs/draft/category_weights.md). Weekly totals only
# Last season (2025-26, 19 weeks, 14 teams): the mean of the 4 best teams / the mean of all teams, minus 1.
# The best teams are the top 4 by weighted z-score of the team totals. Your own team is one of them.
# The benchmark in each category is the higher of the simulator value and the value that this lift gives.
# benchmark_scale: the share of that benchmark that the board asks for. At 1.0, a perfect $197 core clears it by 2%.
# At 0.9 it clears it by 13%, so the target is reachable in a real auction.
benchmark_scale = 0.9
last_season_lift = { pts = 0.155, reb = 0.182, ast = 0.162, threes = 0.057, stl = 0.124, blk = 0.302 }

[games]
# Games played is a multiplier on per-game value above replacement:
#   availability = (projected games / full_season) ^ power
# power = 0   : rank by per-game value only
# power = 1   : value is proportional to total games (season-total value)
# power > 1   : more penalty for missed games
full_season = 82
power = 1.25

[playoffs]
# The playoff schedule does not change the rankings. These settings make the schedule
# columns in rankings.csv, playoff_schedule.csv and the draft board flags.
# A player with rests_b2b ([risk] file) does not get the second night of a back-to-back in these columns.

# Fantasy playoff weeks (Monday to Sunday).
weeks = [
  { name = "wk19", start = 2027-03-08, end = 2027-03-14 },
  { name = "wk20", start = 2027-03-15, end = 2027-03-21 },
  { name = "wk21", start = 2027-03-22, end = 2027-03-28 },
]
# Other playoff windows, for public leagues. draft/board.py writes one more page for each window:
# draft_board_<first week>-<last week>.html. The page has no simulator columns and keeps its own team.
# A list on the board switches between the pages. The weeks above stay the default.
other_windows = [
  [
    { name = "wk20", start = 2027-03-15, end = 2027-03-21 },
    { name = "wk21", start = 2027-03-22, end = 2027-03-28 },
    { name = "wk22", start = 2027-03-29, end = 2027-04-04 },
  ],
]

# Value of one playoff week for each number of games, relative to a 3-game week.
# A linear scale is 2 = 0.67 and 4 = 1.33. These values make 2-game weeks
# hurt more and 4-game weeks help more.
[playoffs.week_value]
0 = 0.00
1 = 0.25
2 = 0.50
3 = 1.00
4 = 1.40
5 = 1.60

# Quality games: games on low-volume days. If your core players play on these days,
# you can stream on high-volume days, when more free agents play.
[quality_games]
max_games_per_day = 6      # a day with this number of NBA games or fewer is a low-volume day
# Value added to a playoff week for each quality game in that week.
# For comparison, a 4-game week adds 0.40 over a 3-game week.
bonus = 0.10

# Settings for draft/board.py (writes draft_board.md and draft_board.html)
[board]
low_games = 60             # mark players projected for fewer games than this
tiers = [20, 40, 60]       # last rank in each tier (Markdown only). The last tier holds all other players.

# Team builder on the draft board: started games, lost games and holes of your core in the playoffs.
# See Playoffs.game_counts() in draft/team_score.py.
[team_builder]
core_max_rank = 75         # a player with rank <= this number is core by default
# A week with fewer started games than this gets a red cell.
# Mean started games per week of the 7-player cores ranked 1-7, 8-14, ... 92-98 (22.9), rounded down.
weak_week_started = 22

# Flags: green = good, gray = average, yellow = poor.
# S = playoff games: green at good_playoff_games or more, yellow at poor_playoff_games or fewer.
# Q = quality games: green at good_quality_games or more, yellow at poor_quality_games or fewer.
# A red X replaces the S and Q flags when the player has a playoff week with avoid_week_games games or fewer.
# Set avoid_week_games = 0 to turn off the X.
[flags]
good_playoff_games = 11
poor_playoff_games = 9
good_quality_games = 3
poor_quality_games = 1
avoid_week_games = 2

# The trade tool (src/fantasyhoops/trade/, docs/trade/README.md). The trade deadline comes from the Yahoo league
# settings, so this section has no deadline value.
[trade]
untouchable = ["Cooper Flagg"]  # the tool never offers these players. They are always in your kept set.
# The players that you are willing to trade. Edit the list through the season. The suggestions give only these
# players. An empty list offers each player who is not untouchable. untouchable wins over offer. The trade builder
# still allows any player.
offer = ["Rudy Gobert", "Matas Buzelis", "Coby White"]
value_band = [0.95, 1.10]       # the value of the player you get: give - 5% to give + 10% of |give|
kept = 8                        # the playoff starts count this number of players of a team (the kept set)
per_player = 3                  # suggestions for each player you give, at most
rows = 20                       # suggestions in all, at most

# The Categories quadrant of the player card (src/fantasyhoops/players/categories.py, #188). The "now" line of a
# category is (n x season + k x projection) / (n + k), with n games played and k from shrink.
# The owner approved the shrink values on 2026-10-30.
[players.categories]
shrink = { pts = 4, reb = 4, ast = 4, threes = 10, blk = 10, stl = 15 }  # shrinkage strength in games
gap_points = 25                 # a projection-gap signal needs this gap between "now" and "proj", in percentile points
gap_games = 5                   # and this number of games or more
